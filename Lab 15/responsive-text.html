<!DOCTYPE html>
<html>
<head>
    <title>Responsive Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 1rem;
        }

        h1 {
            font-size: 1.5rem;
        }

        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Text Example</h1>

    <p>
        This is a responsive paragraph.
        The heading is larger when the window is 600px wide or more.
    </p>

</body>
</html>
