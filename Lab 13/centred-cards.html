<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Centred Cards</title>

    <style>
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 300px;
        }

        .card {
            background-color: lightblue;
            border: 2px solid navy;
            padding: 20px;
            width: 150px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Pricing Plans</h1>

    <div class="row">

        <div class="card">
            <h3>Starter</h3>
            <p>Price: 199</p>
        </div>

        <div class="card">
            <h3>Standard</h3>
            <p>Price: 349</p>
        </div>

        <div class="card">
            <h3>Premium</h3>
            <p>Price: 499</p>
        </div>

    </div>

</body>
</html>
