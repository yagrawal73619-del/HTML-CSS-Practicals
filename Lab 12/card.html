<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Card</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 12px;
            padding: 16px;
        }
    </style>
</head>
<body>

    <h1>Card Example</h1>

    <div class="card">
        <h3>My CSS Card</h3>
        <p>This is a simple card with a coloured background,
        border, rounded corners and padding.</p>
    </div>

</body>
</html>
