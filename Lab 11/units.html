<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        .box1 {
            width: 200px;
            height: 40px;
            background-color: lightblue;
        }

        .box2 {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>CSS Units Example</h1>

    <div class="box1">200 Pixel Box</div>

    <br>

    <div class="box2">50% Width Box</div>

    <p>This is larger text using 1.5rem font size.</p>

</body>
</html>
