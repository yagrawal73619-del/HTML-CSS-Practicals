<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid First</title>

    <style>
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
            font-size: 24px;
            border: 1px solid navy;
        }
    </style>
</head>

<body>

    <h1>CSS Grid Layout</h1>

    <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
    </div>

</body>
</html>
