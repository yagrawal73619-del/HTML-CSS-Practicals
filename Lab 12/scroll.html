<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Scrolling</title>

    <style>
        .scroll-box {
            height: 120px;
            width: 300px;
            overflow: auto;
            border: 2px solid navy;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1>Scrolling Example</h1>

    <div class="scroll-box">
        <p>Line 1: This is the first line.</p>
        <p>Line 2: This is the second line.</p>
        <p>Line 3: This is the third line.</p>
        <p>Line 4: This is the fourth line.</p>
        <p>Line 5: This is the fifth line.</p>
    </div>

</body>
</html>
